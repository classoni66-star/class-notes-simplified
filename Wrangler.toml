name = "classoni"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# This tells Cloudflare where your main server file is
main = ".output/server/index.mjs"

# This section ensures your secrets are recognized
[vars]
# Non-secret variables can go here

# Secrets should be added in the Cloudflare Dashboard (Settings -> Variables and Secrets)
# PESAPAL_CONSUMER_KEY
# PESAPAL_CONSUMER_SECRET
# PESAPAL_IPN_ID
